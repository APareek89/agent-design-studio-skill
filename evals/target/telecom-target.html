<title>Telecom Complaint Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>


/* Layout: tool shell — sticky top bar, left stepper of design stages, one working panel per stage. Node-type colours are the system's visual language. */
:root{
  --bg:#eef1f0;--surface:#ffffff;--surface-2:#f6f8f7;--sunk:#e4e9e7;--fg:#16202a;--muted:#5a6570;--line:#d3dad7;
  --accent:#0b6d66;--accent-soft:#d5ebe7;--accent-fg:#ffffff;
  --t-llm:#6a4bd6;--t-code:#365a7d;--t-read:#2c8549;--t-write:#c25a14;--t-human:#b52f4b;--t-rag:#0b7c8a;--t-decision:#946f00;--t-io:#56606b;
  --crit:#b52f4b;--warn:#946f00;--ok:#2c8549;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418;--surface:#161d23;--surface-2:#1b242b;--sunk:#222c34;--fg:#e3e9ed;--muted:#9aa6af;--line:#2c3740;
  --accent:#4cc3b7;--accent-soft:#16332f;--accent-fg:#0b1513;
  --t-llm:#a48fff;--t-code:#8fb2d6;--t-read:#6cc68b;--t-write:#f09a5b;--t-human:#f37b90;--t-rag:#56c7d4;--t-decision:#e0b64a;--t-io:#a6b0b9;
  --crit:#f37b90;--warn:#e0b64a;--ok:#6cc68b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418;--surface:#161d23;--surface-2:#1b242b;--sunk:#222c34;--fg:#e3e9ed;--muted:#9aa6af;--line:#2c3740;
  --accent:#4cc3b7;--accent-soft:#16332f;--accent-fg:#0b1513;
  --t-llm:#a48fff;--t-code:#8fb2d6;--t-read:#6cc68b;--t-write:#f09a5b;--t-human:#f37b90;--t-rag:#56c7d4;--t-decision:#e0b64a;--t-io:#a6b0b9;
  --crit:#f37b90;--warn:#e0b64a;--ok:#6cc68b;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.005em}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:16px;height:16px}
.brand h1{font-size:17px;font-weight:700}
.proj{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-width:0}
.proj b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.small{padding:3px 8px;font-size:12px}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);background:var(--surface-2);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.side .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 8px 8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:8px;border-radius:7px;cursor:pointer;border:1px solid transparent;text-align:left;background:none;width:100%}
.step:hover{background:var(--sunk)}
.step[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:0 1px 0 var(--line)}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.step.ok .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step .t{font-weight:600;font-size:13.5px;line-height:1.25}
.step .s{font-size:11.5px;color:var(--muted)}
.step.ok .s{color:var(--accent)}
.side .note{margin:18px 8px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

.main{padding-block:22px 60px;padding-left:max(16px,24px);padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.main-in{max-width:1180px}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.phead h2{font-size:26px;font-weight:700}
.persona{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.persona i{width:7px;height:7px;border-radius:50%;background:var(--t-llm);display:inline-block}
.lead{color:var(--muted);max-width:72ch;margin:4px 0 18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.sec{margin-top:26px}
.sec>h3{font-size:17px;font-weight:600;margin-bottom:4px}
.sec>.sub{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:80ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px}
.hyp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);font-weight:600}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap;line-height:1.6}
.chip .d{width:7px;height:7px;border-radius:50%}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.tag-llm{--c:var(--t-llm)}.tag-code{--c:var(--t-code)}.tag-read{--c:var(--t-read)}.tag-write{--c:var(--t-write)}.tag-human{--c:var(--t-human)}.tag-rag{--c:var(--t-rag)}.tag-decision{--c:var(--t-decision)}.tag-io{--c:var(--t-io)}
.chip.ty{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--fg)}
.chip.ty .d{background:var(--c)}
.risk-High{color:var(--crit);font-weight:600}.risk-Medium{color:var(--warn);font-weight:600}.risk-Low{color:var(--ok);font-weight:600}

/* context form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;resize:vertical}
.field textarea{min-height:76px}
.gaps{margin-top:16px;padding:14px 16px}
.gaps ol{margin:6px 0 0;padding-left:20px}
.gaps li{margin:3px 0}

/* conversation map */
.levels{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;margin-bottom:12px}
.levels span.lv{padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.levels .ar{color:var(--muted)}
.basis-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cm{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.tree{padding:6px}
.act{border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act>button{width:100%;display:flex;align-items:center;gap:8px;padding:10px 10px;background:none;border:0;cursor:pointer;text-align:left}
.act>button .aid{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:24px}
.act>button .an{font-weight:600;flex:1}
.act>button .cnt{font-size:11.5px;color:var(--muted)}
.act>button .car{transition:transform .15s;color:var(--muted)}
.act.open>button .car{transform:rotate(90deg)}
.trigs{list-style:none;margin:0 0 8px;padding:0 0 0 30px;display:none}
.act.open .trigs{display:block}
.trig{width:100%;display:flex;gap:8px;align-items:center;justify-content:space-between;background:none;border:1px solid transparent;border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left}
.trig:hover{background:var(--surface-2)}
.trig[aria-selected="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.trig .tn{font-size:13px;min-width:0}
.trig .tid{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}
.detail{padding:18px 20px}
.crumb{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.detail h3{font-size:20px;font-weight:700;margin:2px 0 10px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;margin-top:12px}
.kv dt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-top:2px}
.kv dd{margin:0;min-width:0}
.quotes{display:flex;flex-direction:column;gap:6px}
.q{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.inline-list{display:flex;flex-wrap:wrap;gap:6px}
.dtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.cross{margin-top:16px;padding:14px 16px}
.cross ul{margin:6px 0 0;padding-left:18px}

/* workflow */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.wf-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.wf-wrap svg{display:block}
.wf-node{cursor:pointer}
.wf-node rect{stroke-width:1.5;rx:8}
.wf-node text{font-family:var(--f-body);fill:var(--fg)}
.wf-node .ty{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted);letter-spacing:.04em}
.wf-node:hover rect{stroke-width:2.5}
.wf-node.sel rect{stroke-width:3}
.n-llm rect{fill:color-mix(in srgb,var(--t-llm) 13%,var(--surface));stroke:var(--t-llm)}
.n-code rect{fill:color-mix(in srgb,var(--t-code) 13%,var(--surface));stroke:var(--t-code)}
.n-read rect{fill:color-mix(in srgb,var(--t-read) 13%,var(--surface));stroke:var(--t-read)}
.n-write rect{fill:color-mix(in srgb,var(--t-write) 13%,var(--surface));stroke:var(--t-write)}
.n-human rect{fill:color-mix(in srgb,var(--t-human) 13%,var(--surface));stroke:var(--t-human)}
.n-rag rect{fill:color-mix(in srgb,var(--t-rag) 13%,var(--surface));stroke:var(--t-rag)}
.n-decision rect{fill:color-mix(in srgb,var(--t-decision) 15%,var(--surface));stroke:var(--t-decision);stroke-dasharray:5 3}
.n-io rect{fill:var(--surface-2);stroke:var(--t-io)}
.wf-edge{fill:none;stroke:var(--muted);stroke-width:1.4}
.wf-edge.dash{stroke-dasharray:4 4}
.wf-elbl{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.wf-elbl-bg{fill:var(--surface)}
.arrowhead{fill:var(--muted)}
.wf-detail{margin-top:14px;padding:16px 18px}
.wf-detail h3{font-size:18px;margin:4px 0 6px}

/* fmea */
.formula{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;font-size:13px}
.formula .box{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fm-table td.sod input{width:44px;font:inherit;font-family:var(--f-mono);text-align:center;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);padding:2px}
.rpn{font-family:var(--f-mono);font-weight:600;padding:2px 8px;border-radius:5px;display:inline-block;min-width:42px;text-align:center}
.rpn.hi{background:color-mix(in srgb,var(--crit) 16%,var(--surface));color:var(--crit)}
.rpn.md{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.rpn.lo{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.fm-row{cursor:pointer}
.fm-row:hover td{background:var(--surface-2)}
.fm-row.flash td{background:var(--accent-soft)}
.fm-open td{background:var(--surface-2)}
.fm-x{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:6px 2px}
.fm-x h4{margin:0 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fm-x p{margin:0}
.common{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.fm-name{font-weight:600}
.fm-id{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* evals */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tc{padding:14px;display:flex;flex-direction:column;gap:8px}
.tc .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tc .lb{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tc .in{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.tc .pass{font-size:12.5px;border-left:3px solid var(--ok);padding-left:8px}
.gates{counter-reset:g;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.gates li{padding:10px 14px;display:flex;gap:10px}
.gates li::before{counter-increment:g;content:counter(g);font-family:var(--f-mono);color:var(--accent);font-weight:600}

/* measurement */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .k{font-weight:600}
.kpi .bt{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px;font-family:var(--f-mono)}
.kpi .bt .b{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.kpi .bt .tg{font-size:20px;font-weight:600;color:var(--accent)}
.kpi ul{margin:0;padding-left:16px;font-size:13px}
.kpi li{margin:3px 0}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.ph{padding:14px;border-right:1px solid var(--line);position:relative}
.ph:last-child{border-right:0}
.ph .w{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ph .nm{font-family:var(--f-display);font-weight:700;font-size:16px;margin:2px 0 6px}
.ph .gate{margin-top:10px;font-size:12px;border-top:1px dashed var(--line);padding-top:8px}
.ph .gate b{color:var(--accent)}
.ph ul{margin:0;padding-left:16px;font-size:12.5px}

/* models */
.calc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.calc .in-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px}
.calc .in-grid .field input{font-family:var(--f-mono)}
.calc .out{padding:16px}
.big{font-family:var(--f-mono);font-size:28px;font-weight:600;color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;padding:0 14px 14px;font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex;margin:6px 0 2px}
.bar span{display:block;height:100%}

/* prd */
.prd{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;padding:18px;max-height:72vh;overflow:auto;margin:0}
.callout{padding:14px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.callout p{margin:4px 0 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt-pick{color:var(--accent);font-weight:600}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-block:8px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side .lbl,.side .note{display:none}
  .steps{flex-direction:row;gap:4px;width:max-content}
  .step{width:auto;grid-template-columns:22px auto;white-space:nowrap}
  .step .s{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .cm,.calc,.two{grid-template-columns:1fr}
  .phases{grid-template-columns:1fr 1fr}
  .ph:nth-child(2){border-right:0}
  .ph:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:620px){
  .form{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin-bottom:10px}
  .fm-x{grid-template-columns:1fr}
  .phases{grid-template-columns:1fr}
  .ph{border-right:0;border-bottom:1px solid var(--line)}
  .calc .in-grid{grid-template-columns:1fr 1fr}
  .phead h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2 additions: task tree, components, approval bar, export cards */
:root{--t-ml:#8a4f9e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-ml:#d39be6}}
:root[data-theme="dark"]{--t-ml:#d39be6}
.tag-ml{--c:var(--t-ml)}
.n-ml rect{fill:color-mix(in srgb,var(--t-ml) 13%,var(--surface));stroke:var(--t-ml)}
.step.lock{opacity:.55}
.step.lock .n{border-style:dashed}
.step.stale .s{color:var(--warn)}
.fit{margin-bottom:16px}
.tree-wrap{overflow-x:auto;padding-bottom:6px}
.tree2{min-width:1180px;display:flex;flex-direction:column;align-items:center}
.root{background:var(--fg);color:var(--bg);border-radius:9px;padding:10px 18px;font-family:var(--f-display);font-weight:700;font-size:16px;text-align:center}
.root small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;opacity:.75}
.stem{width:2px;height:16px;background:var(--line)}
.trow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:100%;position:relative;padding-top:16px}
.trow::before{content:"";position:absolute;top:0;left:calc(100%/12);right:calc(100%/12);height:2px;background:var(--line)}
.tcol{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcol::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--line)}
.tbox{background:var(--surface);border:1.5px solid var(--fg);border-radius:8px;padding:8px 10px}
.tbox .id{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tbox .nm{font-weight:600;font-size:14px;line-height:1.25}
.mode{display:inline-block;margin-top:4px;font-family:var(--f-mono);font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.subs{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:2px solid var(--line);margin-left:10px}
.leaf{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 9px;cursor:pointer;text-align:left;width:100%;display:block}
.leaf:hover{border-color:var(--accent)}
.leaf[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.leaf.off{opacity:.45}
.leaf .lt{display:flex;gap:6px;align-items:flex-start}
.leaf .lt input{margin:2px 0 0}
.leaf .ln{font-weight:600;font-size:12.5px;line-height:1.3}
.leaf .bs{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.leaf .bs .chip{font-size:10.5px;padding:0 6px}
.leaf .exs{font-size:11.5px;color:var(--muted);line-height:1.35}
.leaf .exs div::before{content:"\2022 ";}
.leaf .meta{font-size:10.5px;font-family:var(--f-mono);color:var(--muted);margin-top:4px}
.src{font-size:10px;font-family:var(--f-mono);margin-top:3px}
.src.up{color:var(--accent)}.src.hy{color:var(--warn)}
.attr td.ck{text-align:center;color:var(--accent);font-weight:700}
.ctype{margin-top:20px}
.ctype>h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cc{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cc.off{opacity:.45}
.cc .h{display:flex;gap:8px;align-items:flex-start}
.cc .h input{margin-top:3px}
.cc .nm{font-weight:600}
.cc .why{font-size:12px;border-left:3px solid var(--t-code);padding-left:8px;color:var(--muted)}
.cc .tk{display:flex;flex-wrap:wrap;gap:4px}
.taskbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.wf-node.dim{opacity:.18}
.wf-node .ex{font-size:10.5px;fill:var(--muted);font-style:italic}
.approve{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.08);z-index:3}
.approve .st{font-weight:600}
.approve .st.ok{color:var(--ok)}.approve .st.stale{color:var(--warn)}
.approve .cnt{color:var(--muted);font-size:13px}
.approve .sp{flex:1}
.ups{display:grid;gap:8px;margin-top:8px}
.up{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.up .fi{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.up .fs{font-size:12.5px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop label{color:var(--accent);font-weight:600;cursor:pointer}
.xcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.xc{display:flex;flex-direction:column;overflow:hidden}
.xc .thumb{height:150px;overflow:hidden;font-family:var(--f-mono);font-size:9.5px;line-height:1.4;padding:10px;white-space:pre;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);position:relative}
.xc .thumb::after{content:"";position:absolute;inset:auto 0 0;height:50px;background:linear-gradient(transparent,var(--surface-2))}
.xc .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.xc .fn{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.xc .ds{font-size:12.5px;color:var(--muted);flex:1}
@media (max-width:620px){.ccards{grid-template-columns:1fr}}

/* v1.2 target additions */
.approve{position:static}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 8px 6px}
.brief-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.sentence{font-size:17px;line-height:1.45;max-width:70ch;margin:0 0 18px}
.calls{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.calls li{padding:12px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.calls .n{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.calls .rej{font-size:12.5px;color:var(--muted);margin-top:4px}
.calls .rej b{color:var(--fg);font-weight:600}
.box{padding:14px 16px}
.box h3{font-size:15px;margin:0 0 8px}
.kpimini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.kpimini:last-child{border-bottom:0}
.kpimini .v{font-family:var(--f-mono);white-space:nowrap}
.kpimini .v b{color:var(--accent)}
.kpimini .df{grid-column:1/-1;color:var(--muted);font-size:12px}
.blk{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px}
.blk:last-child{border-bottom:0}
.blk .o{display:block;color:var(--muted);font-size:12px}
.status{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.trow.four::before{left:calc(100%/8);right:calc(100%/8)}
.tree2.four{min-width:980px}
.why-r{font-size:10.5px;color:var(--crit);font-family:var(--f-mono)}
.wf-tag{font-family:var(--f-mono);font-size:9.5px;fill:var(--crit)}
.wf-tag.tk{fill:var(--warn)}
.wf-node .sh{font-size:10.5px;fill:var(--muted)}
.mini{font-size:12.5px;color:var(--muted)}
.cov td.gap{color:var(--crit);font-weight:600}
.cov td.ok{color:var(--ok);font-weight:600}
.heat{border-collapse:separate;border-spacing:3px;font-size:11.5px}
.heat td,.heat th{text-align:center;padding:4px 6px;border:0;border-radius:4px;min-width:38px}
.heat th{background:none}
.h-hi{background:color-mix(in srgb,var(--crit) 20%,var(--surface))}
.h-md{background:color-mix(in srgb,var(--warn) 20%,var(--surface))}
.h-lo{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.filelist{display:grid;gap:6px;margin-top:8px}
.fl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fl .fn{font-family:var(--f-mono);font-weight:500}
@media (max-width:900px){.brief-grid{grid-template-columns:1fr}.fl{grid-template-columns:1fr}}

ney and need limits; regulator (TRAI) penalties for delays; customers try prompt tricks to get credits.", "H": [{"id": "H1", "statement": "First release handles text channels only (app chat, web chat, WhatsApp, email); voice calls stay with human agents until a transcription slice is designed.", "why": "Voice adds transcription error and latency risks that need their own design.", "owner": "Head of CX operations (proposed)", "validation": "Channel volume split and voice transcript quality test", "launchBlocker": false}, {"id": "H2", "statement": "Agent-routed refunds are limited to INR 200 per request and INR 500 per customer per calendar month; anything above goes to a human approver.", "why": "The brief requires limits but gives no values.", "owner": "Finance controller for credits (proposed)", "validation": "Written refund authority matrix signed by finance and risk", "launchBlocker": true}, {"id": "H3", "statement": "Refund approvals are acknowledged within 4 business hours, decided within 24 hours, escalated to the billing team lead after 24 hours and handed to a senior agent after 48 hours.", "why": "Human waits need owners and deadlines; no SLA was supplied.", "owner": "Billing operations manager (proposed)", "validation": "Approver roster and measured queue times in shadow phase", "launchBlocker": true}, {"id": "H4", "statement": "The billing system can recompute a bill period from plan, usage and value-added-service records and return mismatched line IDs (a re-rating API).", "why": "Proving an overcharge needs deterministic recomputation, not model arithmetic.", "owner": "BSS platform owner (proposed)", "validation": "Verification spike against 300 masked bills", "launchBlocker": true}, {"id": "H5", "statement": "The outage feed can lag up to 60 minutes; feed data older than 15 minutes is treated as stale and a live line diagnostic is run before any 'no outage' statement.", "why": "Stale feeds cause wrong 'network is fine' replies.", "owner": "Network opera imits."}, {"id": "CTX2", "t": "Actors and owners", "v": "Customer, contact-centre agent, billing approver, network operations, billing team, compliance officer.", "d": "Customer; contact-centre agent (handoff owner); billing approver; network operations; billing team; regulatory compliance. Owners are proposed roles."}, {"id": "CTX3", "t": "Trigger and first-release scope", "v": "Text channels; wrong bill, slow internet, failed recharge, porting status. Non-goals: plan changes, porting execution, outbound campaigns, goodwill without a human.", "d": "A logged-in customer sends a complaint on a text channel. v1 covers app chat, web chat, WhatsApp and email. Voice calls stay with humans. Rejected broader option: all four channels including calls, because transcription errors would sit upstream of money decisions."}, {"id": "CTX4", "t": "Inputs and systems of record", "v": "Message (untrusted), customer profile, connections, plan history, bills, usage, payments, outage and tower data, line diagnostics, refund policy by version, open tickets, month-to-date credits.", "d": "Message text is untrusted data. Profile, plan, bills, usage and payments come from BSS; outages, towers and diagnostics from OSS; refund rules from the versioned policy store; cases from CRM."}, {"id": "CTX5", "t": "Outputs and terminal outcomes", "v": "Root cause with evidence IDs; explanation, ticket ID or refund request ID; reply in the customer's language; CRM case closed with code family BILL, NET, RCH, PORT or HUMAN.", "d": "Terminals: resolved (reply sent, CRM closed with code) or handed off (human owns the case, customer told). Every refund, ticket or 'done' message carries a record ID from a tool."}, {"id": "CTX6", "t": "KPI definitions", "v": "FCR 45% to 70%; billing resolution 9 days to 2 days; repeat 35% to 15%; leakage under 1% of credits (baseline to be measured).", "d": "FCR = cases resolved in the first contact with no re-contact on the same issue within 7 days / all cases, monthly. Bil function ep(a,b,from,to){const W=160,H=66;
 if(a.id==='W9'&&b.id==='W14'){return{d:`M1135,${a.y+H} L1135,630 L1975,630 L1975,${b.y+H}`,mx:1560,my:630}}
 if(a.id==='W18'&&b.id==='W14'){return{d:`M${a.x+W/2},${a.y} C${a.x+W/2},${a.y-46} ${b.x+W/2},${b.y-46} ${b.x+W/2},${b.y}`,mx:(a.x+b.x+W)/2,my:a.y-36}}
 if(a.x===b.x){return b.y>a.y?{d:`M${a.x+W*.8},${a.y+H} L${b.x+W*.8},${b.y}`,mx:a.x+W*.8,my:(a.y+H+b.y)/2}:{d:`M${a.x+W/2},${a.y} L${b.x+W/2},${b.y+H}`,mx:a.x+W/2,my:(a.y+b.y+H)/2}}
 const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,m=(x1+x2)/2;
 return{d:`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`,mx:m,my:(y1+y2)/2}}
V.workflow=()=>{const N=Object.fromEntries(D.nodes.map(n=>[n.id,n]));
 const on=n=>st.task==='all'||n.tk.some(x=>x.startsWith(st.task+'.'));
 const edges=D.edges.map(([f,t,l])=>{const a=N[f],b=N[t],p=ep(a,b);const dim=!(on(a)&&on(b));
  const lb=l?`<rect class="wf-elbl-bg" x="${p.mx-l.length*3.1-4}" y="${p.my-8}" width="${l.length*6.2+8}" height="15" rx="3"/><text class="wf-elbl" x="${p.mx}" y="${p.my+3}" text-anchor="middle">${esc(l)}</text>`:'';
  return `<g style="opacity:${dim?.15:1}"><path class="wf-edge" d="${p.d}" marker-end="url(#ah)"/>${lb}</g>`}).join('');
 const nodes=D.nodes.map(n=>{const ty=cty(n.c),dec=['W3','W9','W10','W11','W16','W18'].includes(n.id);const t=n.t.length>21?n.t.replace(/^(.{0,21})\s(.*)$/,'$1|$2').split('|'):[n.t];
  return `<g class="wf-node n-${ty} ${st.node===n.id?'sel':''} ${on(n)?'':'dim'}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.t)}">
  <rect x="${n.x}" y="${n.y}" width="160" height="66" rx="${dec?14:6}" ${dec?'stroke-dasharray="0"':''}/>
  <text x="${n.x+9}" y="${n.y+13}" class="ty">${n.id} · ${n.c}${dec?' · decides':''}</text>
  ${t.map((s,i)=>`<text x="${n.x+9}" y="${n.y+28+i*13}" font-size="12" font-weight="600">${esc(s)}</text>`).join('')}
  <text x="${n.x+9}" y="${n.y+(t.length>1?58:47)}" class="sh">${esc(n.short)}</text></g>
  ${D.tags[n.id]?`<text x="${n.x+4}" y="${n.y+80}" class="wf-tag ${D.tags[n.id].startsWith('handoff')?'':'tk'}" style="opacity:${on(n)?1:.2}">↳ ${esc(D.tags[n.id])}</text>`:''}`}).join('');
 const n=N[st.node]||D.nodes[0],c=C[n.c];
 return head('Workflow map','Components wired into a flow. Edges carry their condition. Red notes show where a step hands the case to a person; amber notes show other exits.')+
 `<div class="taskbar"><button type="button" class="fbtn" data-task="all" aria-pressed="${st.task==='all'}">All tasks</button>${tops.map(t=>`<button type="button" class="fbtn" data-task="${t.id}" aria-pressed="${st.task===t.id}">${t.id} ${esc(t.t)}</button>`).join('')}</div>
 <div class="legend">${['llm','read','write','rag','code','human'].map(tyChip).join('')}<span class="chip">rounded box = decision step</span></div>
 <div class="wf-wrap"><svg viewBox="0 0 2540 660" width="2540" height="660" role="img" aria-label="Telecom complaint workflow">
 <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
 <text x="20" y="22" class="wf-elbl">IDENTIFY</text><text x="600" y="22" class="wf-elbl">FIND CAUSE</text><text x="995" y="22" class="wf-elbl">DECIDE</text><text x="1205" y="22" class="wf-elbl">REFUND (CODE + HUMAN)</text><text x="2125" y="535" class="wf-elbl">REPLY AND CLOSE</text>
 ${edges}${nodes}</svg></div>

 <h3>${esc(n.t)}</h3><dl class="kv"><dt>Example</dt><dd>${esc(n.ex)}</dd><dt>What the part does</dt><dd>${esc(c.d)}</dd>
 <dt>Next steps</dt><dd>${n.tr.length?`<div class="tw"><table><thead><tr><th>Go to</th><th>When</th></tr></thead><tbody>${n.tr.map(r=>`<tr><td class="mono">${r.to} ${esc(N[r.to].t)}</td><td>${esc(r.when)}${r.mode==='fan-out'?' <span class="chip">runs in parallel</span>':''}</td></tr>`).join('')}</tbody></table></div>`:`<b>Ends here.</b> ${esc(n.term)}`}</dd>

 <dt>Failure modes</dt><dd><div class="inline-list">${D.fmea.filter(f=>f.componentIds.includes(n.c)).map(f=>lnk(f.id)).join('')||'<span class="mini">None</span>'}</div></dd></dl></div>
 <div class="sec"><h3>Coverage</h3><p class="sub">Every subtask reaches at least one step.</p><div class="tw"><table><thead><tr><th>Subtask</th><th>Steps</th><th>Status</th></tr></thead><tbody>

V.fmea=()=>{const list=[...D.fmea].sort((a,b)=>rpn(b)-rpn(a));
 const cell=(s,o)=>{const fs=D.fmea.filter(f=>f.severity===s&&f.occurrence===o);const sc=s*o;return `<td class="${sc>=40||s>=8?'h-hi':sc>=25?'h-md':'h-lo'}">${fs.map(f=>f.id).join(' ')||'&nbsp;'}</td>`};
 return head('Failure modes (FMEA)','Severity, occurrence and detection on 1–10; RPN = S × O × D. Scores rank what to fix first; they are estimates, not measurements.')+
 `<div class="two"><div class="panel box"><h3>Severity × occurrence</h3><div style="overflow-x:auto"><table class="heat"><thead><tr><th>S \\ O</th>${[2,3,4,5,6].map(o=>`<th>${o}</th>`).join('')}</tr></thead><tbody>${[9,8,7,6,5].map(s=>`<tr><th>${s}</th>${[2,3,4,5,6].map(o=>cell(s,o)).join('')}</tr>`).join('')}</tbody></table></div></div>

 <div class="sec"><div class="tw"><table class="fm-table"><thead><tr><th>Risk</th><th>Subtasks</th><th>S</th><th>O</th><th>D</th><th>RPN</th><th>Control</th><th>Tests</th></tr></thead><tbody>

 <td><div class="inline-list">${m.taskIds.map(lnk).join('')}</div></td><td class="num">${m.severity}</td><td class="num">${m.occurrence}</td><td class="num">${m.detection}</td><td><span class="rpn ${rcls(r,m.severity)}">${r}</span></td><td style="min-width:220px">${esc(m.control)}</td><td class="mono" style="font-size:12px">${m.evalIds.join(', ')}</td></tr>
 ${open?`<tr class="fm-open"><td colspan="8"><div class="fm-x"><div><h4>Cause</h4><p>${esc(m.cause)}</p></div><div><h4>Detection</h4><p>${esc(m.detectionMethod)}</p><h4 style="margin-top:8px">Metric → KPI</h4><p>${esc(m.metric)} → <b>${esc(m.kpi)}</b></p></div><div><h4>Owner and gate</h4><p>${esc(m.action)}</p></div></div></td></tr>`:''}`}).join('')}</tbody></table></div>
 <p class="mini" style="margin-top:8px">Click a row for cause, detection, metric and owner.</p></div>`+bar('fmea')};

V.evals=()=>{const G=D.evals.filter(e=>e.category==='golden');const pj=s=>{try{return JSON.parse(s)}catch(e){return null}};
 const cov=D.fmea.map(f=>{const g=G.filter(e=>e.failureModeIds.includes(f.id));return [f,g]});

 return head('Evals','What must be tested before release. These are test plans; nothing here has been run yet.')+
 `<div class="sec" style="margin-top:0"><h3>Coverage</h3><p class="sub">Each risk and each high-risk subtask, with its tests. A row with no test would block export.</p>
 <div class="tw cov"><table><thead><tr><th>Risk or subtask</th><th>Tests</th><th>Key test</th><th>Status</th></tr></thead><tbody>

 ${hl.map(([l,g])=>`<tr><td><span class="fm-id">${l.id}</span> ${esc(l.t)} <span class="why-r">high risk</span></td><td class="num">${g.length}</td><td>${g[0]?g[0].id+' '+esc(g[0].t):'—'}</td><td class="${g.length?'ok':'gap'}">${g.length?'Covered':'Gap'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="sec"><h3>Golden cases</h3><p class="sub">Full fixtures and mocks are in eval-set.json.</p><div class="cards">${G.map(e=>{const a=pj(e.passRule);return `<div class="panel tc"><div class="h"><span class="fm-id">${e.id} · ${esc(e.t)}</span><span class="chip mono">${e.failureModeIds[0]||'positive'}</span></div>
  <div class="lb">Must hold</div><div class="pass">${a&&a.assert?a.assert.map(esc).join('<br>'):esc(e.passRule)}</div></div>`}).join('')}</div></div>
 <div class="sec"><h3>Offline, online and release</h3><div class="tw"><table><thead><tr><th>Test</th><th>Layer</th><th>Metric</th><th>Target</th><th>Cadence</th><th>Alert</th></tr></thead><tbody>
 ${D.evals.filter(e=>e.category!=='golden').map(e=>`<tr><td><span class="fm-id">${e.id}</span> ${esc(e.t)}</td><td>${e.category}</td><td>${esc(e.metric)}</td><td class="mono">${esc(e.target)}</td><td>${esc(e.cadence)}</td><td>${esc(e.alertThreshold)}</td></tr>`).join('')}</tbody></table></div></div>`+bar('evals')};

V.measure=()=>{const R=D.roll;const K=R.filter(r=>r.category==='kpi'),Ph=R.filter(r=>r.category==='phase'),X=R.filter(r=>r.category==='experiment'),O=R.filter(r=>r.category==='owner');
 return head('Measurement and rollout','How value is proven, and how autonomy grows only with evidence.')+
 `<div class="sec" style="margin-top:0"><h3>KPI tree</h3><div class="kpis">${K.map(k=>`<div class="panel kpi"><div class="k">${esc(k.t)}</div><div class="mini" style="margin:4px 0 8px">${esc(k.businessKpi)}</div><ul>${k.aiMetrics.map(m=>`<li>${esc(m)}</li>`).join('')}</ul><div class="mini">${esc(k.d)}</div></div>`).join('')}</div></div>
 <div class="sec"><h3>Rollout</h3><div class="phases">${Ph.map(p=>`<div class="ph"><div class="nm">${esc(p.t)}</div><div style="font-size:12.5px">${esc(p.phase)}</div><div class="gate">${esc(p.gate)}</div><div class="w" style="margin-top:6px">${esc(p.owner)}</div></div>`).join('')}</div></div>
 <div class="sec two">${X.map(x=>`<div class="panel box"><h3>${esc(x.t)}</h3><p style="font-size:13px;margin:0 0 6px">${esc(x.gate)}</p><p class="mini" style="margin:0">${esc(x.experiment)}</p></div>`).join('')}
 ${O.map(o=>`<div class="panel box"><h3>${esc(o.t)}</h3><p style="font-size:13px;margin:0 0 6px">${esc(o.owner)}</p><p class="mini" style="margin:0">${esc(o.gate)}</p></div>`).join('')}</div>`+bar('measure')};

V.export=()=>{const F=[['DESIGN.pdf','The readable report: decision brief on page 1, then these stages, at most 12 pages.'],['build/','00-overview.md plus 7 milestone files, each under 25 KB, with only the contracts, tests and acceptance criteria that milestone needs.'],['design.json','The single source for every ID, contract and fixture.'],['README.md','What each file is and what to open first.'],['_evidence/','Review rounds, validation, run report, eval-set.json, FMEA register and assumptions.']];
 const M=['00 Overview and rules','01 Workflow skeleton W1–W20 with audit events','02 Read tools C4–C9 behind the identity gateway','03 Code checks C13–C16 with unit and property tests','04 Write tools C10–C12 and refund ledger','05 Agents C1–C3 with schema output and abstain','06 Durable approval and posting W13, W15, W16','07 Handoff queue and monitors EV19–EV22'];
 return head('Export','What the user receives. Five items at the top level; everything else sits in _evidence/.')+
 `<div class="filelist">${F.map(f=>`<div class="fl"><span class="fn">${f[0]}</span><span>${esc(f[1])}</span></div>`).join('')}</div>
 <div class="sec"><h3>Build milestones</h3><ol class="gates">${M.map(m=>`<li class="panel">${esc(m)}</li>`).join('')}</ol></div>
 <div class="sec"><h3>Acceptance criteria</h3><div class="panel box"><ul style="margin:0;padding-left:18px;font-size:13px">${D.export.acceptanceCriteria.map(a=>`<li style="margin:3px 0">${esc(a)}</li>`).join('')}</ul></div></div>`+bar('export')};

V.assumptions=()=>head('Assumptions','Facts the brief did not give. Each has an owner and a way to verify it. Launch blockers must be cleared before the shadow phase.')+
 `<div class="tw"><table><thead><tr><th>ID</th><th>Assumption</th><th>Owner (proposed)</th><th>How to verify</th><th>Blocks launch</th></tr></thead><tbody>${D.H.map(h=>`<tr><td class="mono">${h.id}</td><td>${esc(h.statement)}</td><td>${esc(h.owner.replace(' (proposed)',''))}</td><td>${esc(h.validation)}</td><td style="font-weight:600;color:${h.launchBlocker?'var(--crit)':'var(--muted)'}">${h.launchBlocker?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div>`;

V.review=()=>{const r=D.review;const names=['Scope','Traceability','Workflow and recovery','Contracts','Authority and privacy','Uncertainty','Architecture','Models and cost','Risk analysis','Evals','KPIs and rollout','Handoff'];
 return head('Review',`Method: ${r.method}, round ${r.round}, status ${r.status}. Round 1 failed with 3 major issues; it is kept as review-round-1.json.`)+
 `<div class="tw"><table><thead><tr><th>Dimension</th><th>Score</th><th>Evidence</th></tr></thead><tbody>${r.dimensions.map((d,i)=>`<tr><td style="white-space:nowrap">${d.id} ${names[i]}</td><td class="mono">${d.score}/4</td><td>${esc(d.evidence[0])}</td></tr>`).join('')}</tbody></table></div>
 <div class="sec"><h3>Issues</h3><div class="tw"><table><thead><tr><th>Issue</th><th>Severity</th><th>Item</th><th>Note</th><th>Status</th></tr></thead><tbody>${r.issues.map(q=>`<tr><td class="mono">${q.id}</td><td>${q.severity}</td><td class="mono">${q.itemId}</td><td>${esc(q.message)}</td><td style="font-weight:600;color:${q.resolved?'var(--ok)':'var(--warn)'}">${q.resolved?'Resolved':'Open'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="sec"><h3>Limits</h3><ul style="font-size:13px">${r.limitations.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`};

function render(){nav();const s=ALL.find(x=>x.id===st.step);$('#view').innerHTML=V[s.id]()}
document.addEventListener('click',e=>{const t=e.target;
 const b=t.closest('[data-step]');if(b){go(b.dataset.step);return}
 const lf=t.closest('[data-leaf]');if(lf){st.leaf=lf.dataset.leaf;render();return}
 const gl=t.closest('[data-goleaf]');if(gl){st.leaf=gl.dataset.goleaf;go('tasks');return}
 const sw=t.closest('[data-showwf]');if(sw){st.task=sw.dataset.showwf;go('workflow');return}
 const tk=t.closest('[data-task]');if(tk){st.task=tk.dataset.task;render();return}
 const nd=t.closest('[data-node]');if(nd){st.node=nd.dataset.node;render();return}
 const gf=t.closest('[data-gofm]');if(gf){st.fmOpen=gf.dataset.gofm;go('fmea');setTimeout(()=>{const r=document.getElementById('row-'+gf.dataset.gofm);if(r){r.scrollIntoView({block:'center'});r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),1200)}},30);return}
 const row=t.closest('[data-fmrow]');if(row){st.fmOpen=st.fmOpen===row.dataset.fmrow?null:row.dataset.fmrow;render();return}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const el=e.target.closest&&(e.target.closest('[data-node]')||e.target.closest('[data-leaf]'));if(!el)return;e.preventDefault();el.click()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.calc){st.calc[t.dataset.calc]=parseFloat(t.value)||0;render()}});
render();
</script>
